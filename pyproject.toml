[build-system]
requires = ["setuptools>=68", "setuptools-scm>=8"]
build-backend = "setuptools.build_meta"

[project]
name = "agbr"
dynamic = ["version"]
description = "Parse existing systems into Agent Integration Kits: a Claude-controllable tool layer for APIs, databases, GraphQL, and jobs."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "AgentBridge contributors" }]
keywords = ["agents", "mcp", "tool-layer", "agent-integration-kit", "openapi", "graphql", "database", "claude", "anthropic", "claude-agent-sdk"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
]

[project.optional-dependencies]
agent = ["claude-agent-sdk>=0.1.0"]
ai = ["anthropic>=0.30.0"]
all = ["claude-agent-sdk>=0.1.0", "anthropic>=0.30.0"]

[project.scripts]
agentbridge = "agentbridge.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
agentbridge = ["assets/*.js", "assets/*.LICENSE"]

[tool.setuptools_scm]
fallback_version = "0.0.0"
